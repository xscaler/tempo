name: xs-weekly

# Rebuilds the latest release when that clears something. The published image
# is scanned for fixable HIGH and CRITICAL findings. If there are any, a
# candidate is built from the same commit (amd64, not pushed) and scanned the
# same way. Only when the candidate's finding set is strictly smaller, with no
# new findings, is the tag v<ver>-xs.<n+1> created on the same commit and
# xs-release.yml dispatched for it. Otherwise the job exits 0 and lists the
# findings that need an upstream bump in the job summary.

on:
  schedule:
    - cron: '43 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

env:
  GHCR_REPO: ghcr.io/xscaler/tempo
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  rescan:
    name: Scan latest release and rebuild if needed
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write   # create the next release tag
      actions: write    # dispatch xs-release.yml
      packages: read    # pull the image for the scan
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find the latest release tag
        id: latest
        run: |
          set -euo pipefail
          git fetch --tags --force
          tag="$(git tag --list 'v*-xs.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-xs\.[0-9]+$' | sort -V | tail -1)"
          if [ -z "$tag" ]; then
            echo "::notice::no v*-xs.* tag exists yet, nothing to scan"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Latest release tag: ${tag}"

      - name: Log in to GHCR
        if: steps.latest.outputs.found == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan the published image
        if: steps.latest.outputs.found == 'true'
        id: scan
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trivy-cache"
          docker run --rm --user "$(id -u):$(id -g)" \
            -e TRIVY_CACHE_DIR=/cache \
            -e TRIVY_DB_REPOSITORY="public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2" \
            -e TRIVY_JAVA_DB_REPOSITORY="public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1" \
            -e DOCKER_CONFIG=/docker-config \
            -v "${HOME}/.docker:/docker-config:ro" \
            -v "${RUNNER_TEMP}/trivy-cache:/cache" \
            -v "${RUNNER_TEMP}:/out" \
            "$TRIVY_IMAGE" image --no-progress --ignore-unfixed --severity HIGH,CRITICAL \
              --format json --output /out/published.json --exit-code 0 \
              "${GHCR_REPO}:${VERSION}"
          jq -r '[.Results[]? | .Vulnerabilities[]? | "\(.VulnerabilityID) \(.PkgName)"] | unique | .[]' \
            "${RUNNER_TEMP}/published.json" > "${RUNNER_TEMP}/published.ids"
          count="$(wc -l < "${RUNNER_TEMP}/published.ids")"
          echo "fixable HIGH/CRITICAL findings in the published image: ${count}"
          cat "${RUNNER_TEMP}/published.ids"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      # A rebuild only helps when it clears something. Build a candidate from
      # the same commit without pushing it and compare finding sets.
      - name: Check out the release commit
        if: steps.latest.outputs.found == 'true' && steps.scan.outputs.count != '0'
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: git checkout --detach "refs/tags/${TAG}"

      - name: Set up Go
        if: steps.latest.outputs.found == 'true' && steps.scan.outputs.count != '0'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Set up Buildx
        if: steps.latest.outputs.found == 'true' && steps.scan.outputs.count != '0'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and scan a candidate
        if: steps.latest.outputs.found == 'true' && steps.scan.outputs.count != '0'
        id: candidate
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          COMPONENT=tempo GOARCH=amd64 make exe VERSION="v${VERSION}"
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            --file cmd/tempo/Dockerfile \
            --output "type=oci,tar=false,dest=${RUNNER_TEMP}/candidate" .
          docker run --rm --user "$(id -u):$(id -g)" \
            -e TRIVY_CACHE_DIR=/cache \
            -e TRIVY_DB_REPOSITORY="public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2" \
            -e TRIVY_JAVA_DB_REPOSITORY="public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1" \
            -v "${RUNNER_TEMP}/candidate:/image:ro" \
            -v "${RUNNER_TEMP}/trivy-cache:/cache" \
            -v "${RUNNER_TEMP}:/out" \
            "$TRIVY_IMAGE" image --no-progress --input /image --ignore-unfixed --severity HIGH,CRITICAL \
              --format json --output /out/candidate.json --exit-code 0
          jq -r '[.Results[]? | .Vulnerabilities[]? | "\(.VulnerabilityID) \(.PkgName)"] | unique | .[]' \
            "${RUNNER_TEMP}/candidate.json" > "${RUNNER_TEMP}/candidate.ids"
          before="$(wc -l < "${RUNNER_TEMP}/published.ids")"
          after="$(wc -l < "${RUNNER_TEMP}/candidate.ids")"
          # New findings that the published image does not have.
          added="$(LC_ALL=C comm -13 "${RUNNER_TEMP}/published.ids" "${RUNNER_TEMP}/candidate.ids" | wc -l)"
          {
            echo "### Weekly rescan of ${VERSION}"
            echo "Published image: ${before} fixable HIGH/CRITICAL findings. Rebuild candidate: ${after}."
            echo
            echo "Findings left in the candidate (need an upstream bump):"
            echo '```'
            cat "${RUNNER_TEMP}/candidate.ids"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$after" -lt "$before" ] && [ "$added" -eq 0 ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "A rebuild would not clear any finding (${before} -> ${after}), no new tag"
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag a rebuild and dispatch the release
        if: steps.candidate.outputs.rebuild == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          set -euo pipefail
          prefix="${TAG%-xs.*}"
          n="${TAG##*-xs.}"
          next="${prefix}-xs.$((n + 1))"
          sha="$(git rev-list -n 1 "$TAG")"
          echo "Creating ${next} on ${sha}"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${next}" -f "sha=${sha}" > /dev/null
          gh workflow run xs-release.yml \
            --repo "$GITHUB_REPOSITORY" --ref "$next" -f "tag=${next}"
          echo "Dispatched xs-release.yml for ${next}"
