name: xs-release

# Builds, scans, signs and publishes the tempo image to GHCR.
#
# Modes, chosen in the prepare job:
#   release    push of a v*-xs.* tag, or workflow_dispatch (from main) with a tag.
#              Publishes ghcr.io/xscaler/tempo:<upstream version>-xs.<n>.
#   rehearsal  push to ci/**. Runs the same publish path against
#              ghcr.io/xscaler/rehearsal/tempo:<short sha>, signed as
#              refs/heads/<branch>. Never touches ghcr.io/xscaler/tempo.
#   verify     pull_request and push to main. Builds both arches and scans.
#              Nothing is pushed or signed.
#
# The binary is built with upstream's `make exe`, with VERSION overridden on
# the command line so upstream's own ldflags inject the version. One build per
# release: the per-arch images built and scanned here are the ones pushed.
#
# Dispatch inputs: `tag` is the release tag. `commit` is optional. With a
# commit the tag does not have to exist; the git tag is created on that commit
# only after the image is published and verified. Without a commit the tag
# must already exist. The commit must be an ancestor of origin/main.
#
# Scripts are taken from the workflow's own commit (github.sha). Only the
# source tree being built comes from the release commit.
#
# Cosign identity of every signature made here:
#   https://github.com/xscaler/tempo/.github/workflows/xs-release.yml@<github.ref>

on:
  push:
    branches: [main, 'ci/**']
    tags: ['v*-xs.*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (for example v3.1.1-xs.0)'
        type: string
        required: true
      commit:
        description: 'Commit to release (40 hex characters). Empty means the existing tag.'
        type: string
        required: false

concurrency:
  group: xs-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: tempo
  SOURCE_URL: https://github.com/xscaler/tempo
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  BUILDKIT_IMAGE: moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
  CERT_OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      mode: ${{ steps.vars.outputs.mode }}
      publish: ${{ steps.vars.outputs.publish }}
      tag: ${{ steps.vars.outputs.tag }}
      commit: ${{ steps.vars.outputs.commit }}
      version: ${{ steps.vars.outputs.version }}
      repo: ${{ steps.vars.outputs.repo }}
      image_tag: ${{ steps.vars.outputs.image_tag }}
      identity: ${{ steps.vars.outputs.identity }}
      existing: ${{ steps.existing.outputs.digest }}
    steps:
      - name: Check out the workflow commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          path: wf
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve mode, tag and commit
        id: vars
        working-directory: wf
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_COMMIT: ${{ inputs.commit }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          mode=verify
          tag=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            mode=release
            tag="$INPUT_TAG"
            if [ "$REF" != "refs/heads/main" ]; then
              echo "::error::releases are dispatched from main, not ${REF}"
              exit 1
            fi
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            mode=release
            tag="$REF_NAME"
          elif [ "$EVENT_NAME" = "push" ] && [[ "$REF" == refs/heads/ci/* ]]; then
            mode=rehearsal
          fi

          commit="$SHA"
          if [ "$mode" = "release" ]; then
            if [[ "$tag" == *$'\n'* ]] || ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-xs\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::tag is not v<upstream-version>-xs.<n>"
              exit 1
            fi
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              tag_commit="$(git rev-parse -q --verify "refs/tags/${tag}^{commit}" || true)"
              if [ -n "$INPUT_COMMIT" ]; then
                if [[ "$INPUT_COMMIT" == *$'\n'* ]] || ! [[ "$INPUT_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
                  echo "::error::commit must be 40 lowercase hex characters"
                  exit 1
                fi
                commit="$INPUT_COMMIT"
                if [ -n "$tag_commit" ] && [ "$tag_commit" != "$commit" ]; then
                  echo "::error::tag ${tag} already points at ${tag_commit}, not ${commit}"
                  exit 1
                fi
              elif [ -n "$tag_commit" ]; then
                commit="$tag_commit"
              else
                echo "::error::tag ${tag} does not exist and no commit was given"
                exit 1
              fi
            fi

            git cat-file -e "${commit}^{commit}"
            if ! git merge-base --is-ancestor "$commit" origin/main; then
              echo "::error::commit ${commit} is not an ancestor of origin/main"
              exit 1
            fi
          fi

          upstream="$(git show "${commit}:VERSION")"
          short="$(git rev-parse --short=7 "$commit")"
          case "$mode" in
            release)
              case "$tag" in
                "v${upstream}-xs."*) ;;
                *)
                  echo "::error::tag ${tag} does not extend the VERSION file (${upstream})"
                  exit 1
                  ;;
              esac
              version="${tag#v}"
              repo="ghcr.io/xscaler/${IMAGE}"
              image_tag="$version"
              ;;
            rehearsal)
              version="${upstream}-xs.rehearsal.${short}"
              repo="ghcr.io/xscaler/rehearsal/${IMAGE}"
              image_tag="$short"
              ;;
            *)
              version="${upstream}-xs.verify"
              repo="ghcr.io/xscaler/${IMAGE}"
              image_tag="$short"
              ;;
          esac

          publish=false
          if [ "$mode" != "verify" ]; then
            publish=true
          fi

          {
            echo "mode=${mode}"
            echo "publish=${publish}"
            echo "tag=${tag}"
            echo "commit=${commit}"
            echo "version=${version}"
            echo "repo=${repo}"
            echo "image_tag=${image_tag}"
            echo "identity=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/xs-release.yml@${REF}"
          } >> "$GITHUB_OUTPUT"

      # A re-run for an image that is already in GHCR must not build a second,
      # different digest. When the tag exists, later jobs reuse its digest.
      - name: Install crane
        if: steps.vars.outputs.publish == 'true'
        run: wf/.github/scripts/xs-install-tools.sh crane

      - name: Log in to GHCR
        if: steps.vars.outputs.publish == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Look for an existing image
        id: existing
        env:
          PUBLISH: ${{ steps.vars.outputs.publish }}
          REPO: ${{ steps.vars.outputs.repo }}
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
        run: |
          set -euo pipefail
          digest=""
          if [ "$PUBLISH" = "true" ]; then
            digest="$(wf/.github/scripts/xs-image-digest.sh "${REPO}:${IMAGE_TAG}")"
            if [ -n "$digest" ]; then
              echo "::notice::${REPO}:${IMAGE_TAG} already exists at ${digest}, reusing it"
            fi
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and scan (${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.existing == ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.prepare.outputs.version }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - name: Check out the workflow commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          path: wf
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Check out the source to build
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          path: src
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: src/go.mod
          cache: false

      - name: Install syft
        run: wf/.github/scripts/xs-install-tools.sh syft

      - name: Set up buildx
        run: docker buildx create --name xs --driver docker-container --driver-opt "image=${BUILDKIT_IMAGE}" --use

      # Same build as upstream's docker workflow: make exe, then the stock
      # Dockerfile. The only change is the version string passed to make.
      - name: Build binary
        working-directory: src
        run: COMPONENT="$IMAGE" GOARCH="$ARCH" make exe VERSION="v${VERSION}"

      # The Dockerfile copies this file into the image unchanged. The pushed
      # image is checked again by the verify job.
      - name: Check the binary version
        working-directory: src
        run: |
          set -euo pipefail
          out="$("./bin/linux/${IMAGE}-${ARCH}" -version)"
          echo "$out"
          case "$out" in
            *"version v${VERSION} "*) ;;
            *) echo "::error::binary does not report v${VERSION}"; exit 1 ;;
          esac

      # An OCI layout directory keeps the exact bytes that were scanned, so the
      # publish job can push them unchanged.
      - name: Build image
        working-directory: src
        run: |
          set -euo pipefail
          docker buildx build \
            --platform "linux/${ARCH}" \
            --provenance=false --sbom=false \
            --label "org.opencontainers.image.source=${SOURCE_URL}" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-only" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${COMMIT}" \
            --file "cmd/${IMAGE}/Dockerfile" \
            --output "type=oci,tar=false,dest=${RUNNER_TEMP}/oci-${ARCH}" \
            .

      - name: Scan image with Trivy
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trivy-out" "${RUNNER_TEMP}/trivy-cache"
          trivy() {
            docker run --rm --user "$(id -u):$(id -g)" \
              -e TRIVY_CACHE_DIR=/cache \
              -e TRIVY_DB_REPOSITORY="public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2" \
              -e TRIVY_JAVA_DB_REPOSITORY="public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1" \
              -v "${RUNNER_TEMP}/oci-${ARCH}:/image:ro" \
              -v "${RUNNER_TEMP}/trivy-out:/out" \
              -v "${RUNNER_TEMP}/trivy-cache:/cache" \
              "$TRIVY_IMAGE" image --no-progress --input /image "$@"
          }
          # Report: SARIF with HIGH and CRITICAL for code scanning.
          trivy --severity HIGH,CRITICAL --format sarif --output /out/trivy.sarif --exit-code 0
          # Report: HIGH findings in the log.
          trivy --severity HIGH --format table --exit-code 0
          # Gate: any fixable CRITICAL fails the build.
          trivy --severity CRITICAL --ignore-unfixed --format table --exit-code 1

      - name: Upload the SARIF report
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-${{ matrix.arch }}
          path: ${{ runner.temp }}/trivy-out/trivy.sarif
          retention-days: 1
          if-no-files-found: warn

      - name: Generate the SBOM
        run: syft "oci-dir:${RUNNER_TEMP}/oci-${ARCH}" -o "spdx-json@2.3=${RUNNER_TEMP}/sbom-${ARCH}.spdx.json"

      - name: Upload image and SBOM
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/oci-${{ matrix.arch }}
            ${{ runner.temp }}/sbom-${{ matrix.arch }}.spdx.json
          retention-days: 1
          if-no-files-found: error

  # Code scanning upload is its own job so that pull request code never runs
  # with security-events: write.
  sarif:
    name: Upload code scanning results
    needs: [prepare, build]
    if: always() && github.event_name != 'pull_request' && needs.build.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download the reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: trivy-*
          path: ${{ runner.temp }}/sarif

      - name: Upload amd64
        if: hashFiles('**/sarif/trivy-amd64/trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/sarif/trivy-amd64/trivy.sarif
          category: trivy-amd64

      - name: Upload arm64
        if: hashFiles('**/sarif/trivy-arm64/trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/sarif/trivy-arm64/trivy.sarif
          category: trivy-arm64

  publish:
    name: Push to GHCR and sign
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.publish == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ needs.prepare.outputs.mode == 'release' && 'release' || '' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
      amd64: ${{ steps.index.outputs.amd64 }}
      arm64: ${{ steps.index.outputs.arm64 }}
    env:
      REPO: ${{ needs.prepare.outputs.repo }}
      IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
      EXISTING: ${{ needs.prepare.outputs.existing }}
      CERT_IDENTITY: ${{ needs.prepare.outputs.identity }}
    steps:
      - name: Check out the workflow commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          path: wf
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Install crane and cosign
        run: wf/.github/scripts/xs-install-tools.sh crane cosign

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download images
        if: env.EXISTING == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images

      # Each arch image goes up by digest, so no per-arch tag is created.
      - name: Push per-arch images by digest
        if: env.EXISTING == ''
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            dir="${RUNNER_TEMP}/images/image-${arch}/oci-${arch}"
            digest="$(jq -r '.manifests[0].digest' "${dir}/index.json")"
            crane push "$dir" "${REPO}@${digest}"
            echo "${arch}=${digest}" >> "${RUNNER_TEMP}/arch.env"
          done

      # The tag is checked again right before the index is created, and the
      # index digest comes from the create command, not from reading the tag.
      - name: Create the multi-arch index
        id: index
        run: |
          set -euo pipefail
          if [ -z "$EXISTING" ]; then
            current="$(wf/.github/scripts/xs-image-digest.sh "${REPO}:${IMAGE_TAG}")"
            if [ -n "$current" ]; then
              echo "::error::${REPO}:${IMAGE_TAG} appeared during this run at ${current}"
              exit 1
            fi
            # shellcheck disable=SC1091
            . "${RUNNER_TEMP}/arch.env"
            docker buildx imagetools create \
              --metadata-file "${RUNNER_TEMP}/index-meta.json" \
              --tag "${REPO}:${IMAGE_TAG}" \
              "${REPO}@${amd64}" "${REPO}@${arm64}"
            digest="$(jq -r '."containerimage.descriptor".digest' "${RUNNER_TEMP}/index-meta.json")"
          else
            digest="$EXISTING"
          fi
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::no index digest"; exit 1 ;;
          esac
          manifest="$(crane manifest "${REPO}@${digest}")"
          amd64="$(jq -r '.manifests[] | select(.platform.architecture == "amd64") | .digest' <<< "$manifest")"
          arm64="$(jq -r '.manifests[] | select(.platform.architecture == "arm64") | .digest' <<< "$manifest")"
          {
            echo "digest=${digest}"
            echo "amd64=${amd64}"
            echo "arm64=${arm64}"
          } >> "$GITHUB_OUTPUT"
          echo "${REPO}:${IMAGE_TAG} is ${digest} (amd64 ${amd64}, arm64 ${arm64})"

      - name: Attest SBOM (amd64)
        if: env.EXISTING == ''
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ needs.prepare.outputs.repo }}
          subject-digest: ${{ steps.index.outputs.amd64 }}
          sbom-path: ${{ runner.temp }}/images/image-amd64/sbom-amd64.spdx.json
          push-to-registry: true

      - name: Attest SBOM (arm64)
        if: env.EXISTING == ''
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ needs.prepare.outputs.repo }}
          subject-digest: ${{ steps.index.outputs.arm64 }}
          sbom-path: ${{ runner.temp }}/images/image-arm64/sbom-arm64.spdx.json
          push-to-registry: true

      # On a re-run the provenance attestation may already exist. Attest only
      # when it does not.
      - name: Check for existing provenance
        id: prov
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          gh attestation verify "oci://${REPO}@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/xs-release.yml"

      - name: Attest build provenance
        if: steps.prov.outcome == 'failure'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.prepare.outputs.repo }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      - name: Sign with cosign
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: wf/.github/scripts/xs-sign.sh "${REPO}@${DIGEST}"

  verify:
    name: Verify signatures and attestations
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      REPO: ${{ needs.prepare.outputs.repo }}
      VERSION: ${{ needs.prepare.outputs.version }}
      DIGEST: ${{ needs.publish.outputs.digest }}
      AMD64: ${{ needs.publish.outputs.amd64 }}
      ARM64: ${{ needs.publish.outputs.arm64 }}
      CERT_IDENTITY: ${{ needs.prepare.outputs.identity }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the workflow commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          path: wf
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Install cosign
        run: wf/.github/scripts/xs-install-tools.sh cosign

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the cosign signatures
        run: |
          set -euo pipefail
          for d in "$DIGEST" "$AMD64" "$ARM64"; do
            cosign verify \
              --certificate-identity "$CERT_IDENTITY" \
              --certificate-oidc-issuer "$CERT_OIDC_ISSUER" \
              "${REPO}@${d}" > /dev/null
            echo "cosign signature verified on ${REPO}@${d}"
          done

      - name: Verify the provenance attestation
        run: |
          gh attestation verify "oci://${REPO}@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/xs-release.yml"

      - name: Verify the SBOM attestations
        run: |
          set -euo pipefail
          for d in "$AMD64" "$ARM64"; do
            gh attestation verify "oci://${REPO}@${d}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/xs-release.yml" \
              --predicate-type https://spdx.dev/Document/v2.3
          done

      - name: Check the version reported by the image
        run: |
          set -euo pipefail
          out="$(docker run --rm "${REPO}@${DIGEST}" -version)"
          echo "$out"
          case "$out" in
            *"version v${VERSION} "*) ;;
            *) echo "::error::image does not report v${VERSION}"; exit 1 ;;
          esac

  # The git tag is created last, so a failed release leaves no tag behind.
  git-tag:
    name: Create the git tag
    needs: [prepare, verify]
    if: needs.prepare.outputs.mode == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Create the tag when it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          if existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha 2>/dev/null)"; then
            obj="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.type)"
            if [ "$obj" = "tag" ]; then
              existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${existing}" --jq .object.sha)"
            fi
            if [ "$existing" != "$COMMIT" ]; then
              echo "::error::tag ${TAG} points at ${existing}, not ${COMMIT}"
              exit 1
            fi
            echo "tag ${TAG} already points at ${COMMIT}"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${TAG}" -f "sha=${COMMIT}" > /dev/null
          echo "created ${TAG} on ${COMMIT}"
